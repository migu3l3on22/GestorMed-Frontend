<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorMed - Empleados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
    <nav>
        <h2>GestorMed</h2>
        <div>
            <a href="empleados.html">Empleados</a>
            <a href="incapacidades.html">Incapacidades</a>
            <a href="seguimiento.html">Seguimiento</a>
            <a href="../index.html">Cerrar sesión</a>
        </div>
    </nav>
    <div class="main-content">
        <h2>Gestión de Empleados</h2>

        <div class="card" style="max-width:600px;">
            <h3>Registrar nuevo empleado</h3>
            <div class="form-group">
                <label>Nombres</label>
                <input type="text" id="nombres">
            </div>
            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" id="apellidos">
            </div>
            <div class="form-group">
                <label>Documento</label>
                <input type="text" id="documento">
            </div>
            <div class="form-group">
                <label>Correo</label>
                <input type="email" id="correo">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="telefono">
            </div>
            <div class="form-group">
                <label>Cargo</label>
                <input type="text" id="cargo">
            </div>
            <div class="form-group">
                <label>Área</label>
                <input type="text" id="area">
            </div>
            <div class="form-group">
                <label>Fecha de Ingreso</label>
                <input type="date" id="fecha_ingreso">
            </div>
            <button onclick="crearEmpleado()">Registrar</button>
            <p id="msg-empleado"></p>
        </div>

        <button class="btn-add" onclick="cargarEmpleados()">Actualizar lista</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Documento</th>
                    <th>Cargo</th>
                    <th>Área</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-empleados">
                <tr><td colspan="7">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
    <script src="../assets/js/empleados.js"></script>
</body>
</html>
