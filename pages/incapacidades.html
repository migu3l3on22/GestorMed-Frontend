<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorMed - Incapacidades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
    <nav>
        <h2>GestorMed</h2>
        <div>
            <a href="empleados.html">Empleados</a>
            <a href="incapacidades.html">Incapacidades</a>
            <a href="seguimiento.html">Seguimiento</a>
            <a href="../index.html">Cerrar sesión</a>
        </div>
    </nav>
    <div class="main-content">
        <h2>Gestión de Incapacidades</h2>

        <div class="card" style="max-width:600px;">
            <h3>Registrar nueva incapacidad</h3>
            <div class="form-group">
                <label>ID Empleado</label>
                <input type="number" id="empleado_id">
            </div>
            <div class="form-group">
                <label>Fecha Inicio</label>
                <input type="date" id="fecha_inicio">
            </div>
            <div class="form-group">
                <label>Fecha Fin</label>
                <input type="date" id="fecha_fin">
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="tipo">
                    <option value="enfermedad_general">Enfermedad General</option>
                    <option value="accidente_laboral">Accidente Laboral</option>
                    <option value="licencia_medica">Licencia Médica</option>
                    <option value="incapacidad_temporal">Incapacidad Temporal</option>
                </select>
            </div>
            <div class="form-group">
                <label>Diagnóstico General</label>
                <input type="text" id="diagnostico_general">
            </div>
            <div class="form-group">
                <label>Entidad Médica</label>
                <input type="text" id="entidad_medica">
            </div>
            <div class="form-group">
                <label>Observaciones</label>
                <input type="text" id="observaciones">
            </div>
            <div class="form-group">
                <label>Días de Incapacidad</label>
                <input type="number" id="dias_incapacidad">
            </div>
            <button onclick="crearIncapacidad()">Registrar</button>
            <p id="msg-incapacidad"></p>
        </div>

        <button class="btn-add" onclick="cargarIncapacidades()">Actualizar lista</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Empleado</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Tipo</th>
                    <th>Días</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-incapacidades">
                <tr><td colspan="7">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
    <script src="../assets/js/incapacidades.js"></script>
</body>
</html>
