<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorMed - Seguimiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
    <nav>
        <h2>GestorMed</h2>
        <div>
            <a href="empleados.html">Empleados</a>
            <a href="incapacidades.html">Incapacidades</a>
            <a href="seguimiento.html">Seguimiento</a>
            <a href="../index.html">Cerrar sesión</a>
        </div>
    </nav>
    <div class="main-content">
        <h2>Seguimiento de Incapacidades</h2>

        <div class="card" style="max-width:600px;">
            <h3>Registrar nuevo seguimiento</h3>
            <div class="form-group">
                <label>ID Incapacidad</label>
                <input type="number" id="incapacidad_id">
            </div>
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="fecha">
            </div>
            <div class="form-group">
                <label>Comentario</label>
                <input type="text" id="comentario">
            </div>
            <div class="form-group">
                <label>Estado</label>
                <select id="estado">
                    <option value="registrada">Registrada</option>
                    <option value="en_revision">En Revisión</option>
                    <option value="aprobada">Aprobada</option>
                    <option value="rechazada">Rechazada</option>
                    <option value="finalizada">Finalizada</option>
                </select>
            </div>
            <div class="form-group">
                <label>Usuario Responsable</label>
                <input type="text" id="usuario_responsable">
            </div>
            <button onclick="crearSeguimiento()">Registrar</button>
            <p id="msg-seguimiento"></p>
        </div>

        <button class="btn-add" onclick="cargarSeguimientos()">Actualizar lista</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Incapacidad</th>
                    <th>Fecha</th>
                    <th>Comentario</th>
                    <th>Estado</th>
                    <th>Responsable</th>
                </tr>
            </thead>
            <tbody id="tabla-seguimientos">
                <tr><td colspan="6">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
    <script src="../assets/js/seguimiento.js"></script>
</body>
</html>
